<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تحلیل احساسات فارسی</title>
  <style>
    :root { color-scheme: dark; font-family: Tahoma, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at top right, #312e81, #111827 50%, #030712); color: #f9fafb; }
    main { width: min(720px, 100%); padding: 36px; border: 1px solid #ffffff22; border-radius: 24px;
      background: #111827dd; box-shadow: 0 24px 70px #0008; backdrop-filter: blur(16px); }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    p { color: #cbd5e1; line-height: 1.8; }
    textarea { width: 100%; min-height: 150px; resize: vertical; padding: 18px; margin: 18px 0 12px;
      border: 1px solid #64748b; border-radius: 14px; background: #0f172a; color: white; font: inherit; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 14px; cursor: pointer; color: white;
      background: linear-gradient(90deg, #7c3aed, #2563eb); font: bold 16px inherit; }
    button:disabled { opacity: .55; cursor: wait; }
    #result { display: none; margin-top: 22px; padding: 20px; border-radius: 14px; background: #0f172a; }
    .label { font-size: 28px; font-weight: bold; }
    .bar { height: 10px; margin: 8px 0 14px; overflow: hidden; border-radius: 10px; background: #334155; }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: #38bdf8; }
    small { color: #94a3b8; }
  </style>
</head>
<body>
<main>
  <h1>تحلیل احساسات فارسی</h1>
  <p>متن فارسی خود را وارد کنید تا احساس مثبت، منفی یا خنثی آن تشخیص داده شود.</p>
  <textarea id="text" maxlength="1000" placeholder="مثلاً: کیفیت محصول خیلی خوب بود و از خریدم راضی هستم."></textarea>
  <button id="submit">تحلیل متن</button>
  <section id="result" aria-live="polite"></section>
</main>
<script>
const translations = { positive: "مثبت", negative: "منفی", neutral: "خنثی" };
const text = document.querySelector("#text"), button = document.querySelector("#submit"), result = document.querySelector("#result");
button.addEventListener("click", async () => {
  if (!text.value.trim()) return;
  button.disabled = true; button.textContent = "در حال تحلیل…";
  try {
    const response = await fetch("/predict", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: text.value}) });
    if (!response.ok) throw new Error("درخواست ناموفق بود");
    const data = await response.json();
    const rows = Object.entries(data.probabilities).sort((a,b) => b[1]-a[1]).map(([key,value]) =>
      `<div>${translations[key]}: ${(value*100).toFixed(1)}٪</div><div class="bar"><span style="width:${value*100}%"></span></div>`).join("");
    result.innerHTML = `<div class="label">${translations[data.label]}</div><p>اطمینان: ${(data.confidence*100).toFixed(1)}٪</p>${rows}<small>مدل: ${data.backend}</small>`;
    result.style.display = "block";
  } catch (error) { result.textContent = error.message; result.style.display = "block"; }
  finally { button.disabled = false; button.textContent = "تحلیل متن"; }
});
</script>
</body>
</html>
